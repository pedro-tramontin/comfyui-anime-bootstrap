# System-wide pip config. Read by EVERY `pip` invocation, including those
# invoked by third-party tools at runtime (e.g. ComfyUI-Manager's auto-
# install of GitPython and other deps on first run).
#
# WHY break-system-packages = true:
#   Debian 12 (bookworm), the base of pytorch/pytorch 2.12+ cudnn9
#   images, ships with PEP 668 enforced (EXTERNALLY-MANAGED marker on
#   the system Python). Any `pip install` into the system Python fails
#   with "error: externally-managed-environment" unless the user passes
#   --break-system-packages. We have a single, container-owned Python
#   (no system Python that the user could break, no system packages
#   managed by apt-pinned pip) so the marker is purely advisory. Opt
#   out here so third-party installers (notably ComfyUI-Manager) work
#   without us having to patch their install code.
#
# This file MUST be copied to /etc/pip.conf in the image. The env-var
# counterpart (PIP_BREAK_SYSTEM_PACKAGES=1) is also exported in the
# Dockerfile as a belt-and-suspenders fallback for tools that override
# the config-file path or set PIP_CONFIG_FILE to a different location.
[global]
break-system-packages = true
