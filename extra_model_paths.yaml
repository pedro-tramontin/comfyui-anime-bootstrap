# ComfyUI extra model paths config
# Tells ComfyUI to scan /workspace/models/ in addition to its default
# /opt/ComfyUI/models/ (ComfyUI source is at /opt/ComfyUI, NOT
# /workspace/ComfyUI -- see Dockerfile for the volume-shadowing
# rationale). Required so the bootstrap's downloads to
# /workspace/models/checkpoints/ are visible to the CheckpointLoaderSimple
# node. Without this, downloads silently land in a path ComfyUI never
# reads -- the symptom is "no models visible" in the API despite
# successful downloads in bootstrap.sh.
#
# This file lives at /opt/ComfyUI/extra_model_paths.yaml (set as
# the ComfyUI base path's relative file).
#
# See: https://github.com/comfyanonymous/ComfyUI/blob/master/extra_model_paths.yaml.example
comfyui:
  base_path: /workspace
  is_default: true
  checkpoints: models/checkpoints
  loras: models/loras
  vae: models/vae
  clip_vision: models/clip_vision
  text_encoders: models/text_encoders
  embeddings: models/embeddings
  unet: models/unet
  diffusion_models: models/diffusion_models
  controlnet: models/controlnet
  photomaker: models/photomaker
  style_models: models/style_models
  t2i_adapter: models/t2i_adapter
  upscale_models: models/upscale_models
  gligen: models/gligen
  model_patches: models/model_patches
  hypernetworks: models/hypernetworks
