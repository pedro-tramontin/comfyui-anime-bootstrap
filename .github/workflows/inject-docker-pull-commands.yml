name: Inject Docker pull commands into release notes

# Runs after release-please publishes a new release and rewrites the body
# to include the full set of `docker pull` commands (default + 4 CUDA
# fallback variants) above the auto-generated changelog.
#
# Why a separate workflow: release-please-action@v5 has no first-class
# option to override the release body, so we just edit it post-hoc.

on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  inject-pull-commands:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Rewrite release body with pull commands
        env:
          GH_TOKEN: ${{ secrets.RELEASE_PLEASE_TOKEN }}
          TAG:     ${{ github.event.release.tag_name }}
        run: |
          set -euo pipefail
          VERSION="${TAG#v}"   # strip leading 'v'

          # Fetch the existing release body (the auto-generated changelog
          # from release-please). We pass the full "owner/repo" so gh
          # doesn't try to guess from a missing git context.
          REPO="${{ github.repository }}"
          EXISTING=$(gh release view "${VERSION}" --repo "${REPO}" --json body --jq '.body // ""')

          {
            printf '## Docker Images\n\n'
            printf '### `pedront/comfyui-anime-bootstrap:v%s` (default — driver 580+, CUDA 13.0, PyTorch 2.7.0)\n\n' "${VERSION}"
            printf '```\ndocker pull pedront/comfyui-anime-bootstrap:v%s\n```\n\n' "${VERSION}"
            printf '### Fallback variants (older NVIDIA drivers)\n\n'
            printf -- '- `docker pull pedront/comfyui-anime-bootstrap:v%s-cuda12.8-pytorch2.7.0` (driver 570+)\n' "${VERSION}"
            printf -- '- `docker pull pedront/comfyui-anime-bootstrap:v%s-cuda12.4-pytorch2.6.0` (driver 550+, e.g. RTX 3090/4090/A4000)\n' "${VERSION}"
            printf -- '- `docker pull pedront/comfyui-anime-bootstrap:v%s-cuda12.1-pytorch2.6.0` (driver 535+)\n' "${VERSION}"
            printf -- '- `docker pull pedront/comfyui-anime-bootstrap:v%s-cuda13.0-pytorch2.7.0` (driver 580+)\n\n' "${VERSION}"
            printf '%s\n' "${EXISTING}"
          } > /tmp/release-body.md

          cat /tmp/release-body.md
          gh release edit "${VERSION}" --repo "${REPO}" --notes-file /tmp/release-body.md
