name: Inject Docker pull commands into release notes

# Runs after release-please publishes a new release and rewrites the body
# to include the full set of `docker pull` commands (default + 4 CUDA
# fallback variants) above the auto-generated changelog.
#
# Why a separate workflow: release-please-action@v5 has no first-class
# option to override the release body, so we just edit it post-hoc.

on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  inject-pull-commands:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Rewrite release body with pull commands
        env:
          GH_TOKEN: ${{ secrets.RELEASE_PLEASE_TOKEN }}
        run: |
          set -euo pipefail
          # TAG is e.g. "v1.7.4". gh release view/edit want the full
          # tag name (with 'v'), so keep TAG as-is for those calls.
          # VER is the bare semver ("1.7.4") for substituting into
          # the docker pull commands we generate.
          TAG="${{ github.event.release.tag_name }}"
          VER="${TAG#v}"

          REPO="${{ github.repository }}"
          EXISTING=$(gh release view "${TAG}" --repo "${REPO}" --json body --jq '.body // ""')

          {
            printf '## Docker Images\n\n'
            printf '### `pedront/comfyui-anime-bootstrap:v%s` (default — driver 580+, CUDA 13.0, PyTorch 2.12.0)\n\n' "${VER}"
            printf '```\ndocker pull pedront/comfyui-anime-bootstrap:v%s\n```\n\n' "${VER}"
            printf '### Fallback variants (older NVIDIA drivers)\n\n'
            printf -- '- `docker pull pedront/comfyui-anime-bootstrap:v%s-cuda12.8-pytorch2.9.1` (driver 570+)\n' "${VER}"
            printf -- '- `docker pull pedront/comfyui-anime-bootstrap:v%s-cuda12.4-pytorch2.6.0` (driver 550+, e.g. RTX 3090/4090/A4000)\n' "${VER}"
            printf -- '- `docker pull pedront/comfyui-anime-bootstrap:v%s-cuda12.1-pytorch2.5.1` (driver 535+)\n\n' "${VER}"
            printf '%s\n' "${EXISTING}"
          } > /tmp/release-body.md

          cat /tmp/release-body.md
          gh release edit "${TAG}" --repo "${REPO}" --notes-file /tmp/release-body.md
