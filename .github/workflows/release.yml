name: Release (build and push versioned image)

on:
  push:
    tags:
      - 'v*.*.*'

env:
  IMAGE_REPO: ${{ github.event.repository.name }}
  CUDA_VERSION: '13.0'
  PYTORCH_VERSION: '2.12.0'
  DRIVER_FLOOR: '12080'
  # Docker Hub is the sole registry. The username and project name are
  # overridable via secrets so the workflow isn't tied to one account.
  # Required secrets (set in repo Settings → Secrets):
  #   DOCKER_USERNAME          — Docker Hub account
  #   DOCKERHUB_TOKEN          — Docker Hub access token (Read/Write/Delete on the target repo)
  #   DOCKERHUB_PROJECT_NAME   — Docker Hub repo name (defaults to "${IMAGE_REPO}" if empty)
  DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
  DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
  DOCKERHUB_PROJECT_NAME: ${{ secrets.DOCKERHUB_PROJECT_NAME }}

jobs:
  release:
    name: build-release
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Read version
        id: cfg
        run: |
          set -euo pipefail
          VERSION=$(cat version.txt | tr -d '[:space:]')
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "Building release ${VERSION} (cuda=${CUDA_VERSION}, pytorch=${PYTORCH_VERSION})"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to Docker Hub
        if: env.DOCKER_USERNAME != '' && env.DOCKERHUB_TOKEN != ''
        uses: docker/login-action@v4
        with:
          username: ${{ env.DOCKER_USERNAME }}
          password: ${{ env.DOCKERHUB_TOKEN }}

      - name: Build and push release image
        run: |
          set -euo pipefail
          # GitHub UI copy-paste of secrets often introduces trailing
          # whitespace/newlines. Strip them or the image tag will be invalid
          # (`***/*** :v1.4.0` with a literal space, see run 27104690093).
          DOCKER_USERNAME="${DOCKER_USERNAME//[[:space:]]/}"
          DOCKERHUB_TOKEN="${DOCKERHUB_TOKEN//[[:space:]]/}"
          DOCKERHUB_PROJECT_NAME="${DOCKERHUB_PROJECT_NAME//[[:space:]]/}"

          if [ -z "${DOCKER_USERNAME}" ] || [ -z "${DOCKERHUB_TOKEN}" ]; then
            echo "::error::DOCKER_USERNAME and DOCKERHUB_TOKEN secrets must be set to publish a release."
            exit 1
          fi

          VERSION="${{ steps.cfg.outputs.version }}"
          DOCKERHUB_REPO="${DOCKERHUB_PROJECT_NAME:-${IMAGE_REPO}}"
          IMAGE="${DOCKER_USERNAME}/${DOCKERHUB_REPO}"
          TAG="${IMAGE}:v${VERSION}"
          LATEST="${IMAGE}:latest"

          docker build \
            --build-arg CUDA_VERSION="${CUDA_VERSION}" \
            --build-arg PYTORCH_VERSION="${PYTORCH_VERSION}" \
            --build-arg DRIVER_FLOOR="${DRIVER_FLOOR}" \
            -t "${TAG}" \
            .

          docker push "${TAG}"
          docker tag "${TAG}" "${LATEST}"
          docker push "${LATEST}"

          echo ""
          echo "=== Release complete ==="
          echo "Published v${VERSION}"
          echo "  - ${TAG}"
          echo "  - ${LATEST}"
