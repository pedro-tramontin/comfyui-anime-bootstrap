name: Release (build and push versioned image)

on:
  push:
    tags:
      - 'v*.*.*'

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}
  CUDA_VERSION: '13.0'
  PYTORCH_VERSION: '2.12.0'
  DRIVER_FLOOR: '12080'
  # Docker Hub mirror — read from secret so the username isn't hardcoded.
  # Required secrets (set in repo Settings → Secrets):
  #   DOCKER_USERNAME          — Docker Hub account
  #   DOCKERHUB_TOKEN          — Docker Hub access token (Read/Write/Delete on the target repo)
  #   DOCKERHUB_PROJECT_NAME   — Docker Hub repo name (defaults to "${IMAGE_NAME##*/}" if empty)
  DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
  DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
  DOCKERHUB_PROJECT_NAME: ${{ secrets.DOCKERHUB_PROJECT_NAME }}
  PUSH_TO_DOCKERHUB: ${{ secrets.DOCKER_USERNAME != '' && secrets.DOCKERHUB_TOKEN != '' }}

jobs:
  release:
    name: build-release
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Read version
        id: cfg
        run: |
          set -euo pipefail
          VERSION=$(cat version.txt | tr -d '[:space:]')
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "Building release ${VERSION} (cuda=${CUDA_VERSION}, pytorch=${PYTORCH_VERSION})"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Log in to Docker Hub
        if: env.PUSH_TO_DOCKERHUB == 'true'
        uses: docker/login-action@v4
        with:
          registry: docker.io
          username: ${{ env.DOCKER_USERNAME }}
          password: ${{ env.DOCKERHUB_TOKEN }}

      - name: Build and push release image
        run: |
          set -euo pipefail
          VERSION="${{ steps.cfg.outputs.version }}"
          REPO="${IMAGE_NAME##*/}"  # bare repo name (used when DOCKERHUB_PROJECT_NAME is empty)
          DOCKERHUB_REPO="${DOCKERHUB_PROJECT_NAME:-${REPO}}"

          # GHCR
          GHCR_TAG="${REGISTRY}/${IMAGE_NAME}:v${VERSION}"
          GHCR_LATEST="${REGISTRY}/${IMAGE_NAME}:latest"

          # Docker Hub mirror (only if secrets are set)
          DOCKERHUB_TAG=""
          DOCKERHUB_LATEST=""
          if [ "${PUSH_TO_DOCKERHUB}" = "true" ]; then
            DOCKERHUB_TAG="docker.io/${DOCKER_USERNAME}/${DOCKERHUB_REPO}:v${VERSION}"
            DOCKERHUB_LATEST="docker.io/${DOCKER_USERNAME}/${DOCKERHUB_REPO}:latest"
          fi

          docker build \
            --build-arg CUDA_VERSION="${CUDA_VERSION}" \
            --build-arg PYTORCH_VERSION="${PYTORCH_VERSION}" \
            --build-arg DRIVER_FLOOR="${DRIVER_FLOOR}" \
            -t "${GHCR_TAG}" \
            .

          docker push "${GHCR_TAG}"
          docker tag "${GHCR_TAG}" "${GHCR_LATEST}"
          docker push "${GHCR_LATEST}"

          if [ "${PUSH_TO_DOCKERHUB}" = "true" ]; then
            docker tag "${GHCR_TAG}" "${DOCKERHUB_TAG}"
            docker push "${DOCKERHUB_TAG}"
            docker tag "${GHCR_TAG}" "${DOCKERHUB_LATEST}"
            docker push "${DOCKERHUB_LATEST}"
          else
            echo "::notice::DOCKER_USERNAME and/or DOCKERHUB_TOKEN secrets are missing; skipping Docker Hub mirror."
          fi

          echo ""
          echo "=== Release complete ==="
          echo "Published v${VERSION}"
          echo "  - ${GHCR_TAG}"
          echo "  - ${GHCR_LATEST}"
          if [ "${PUSH_TO_DOCKERHUB}" = "true" ]; then
            echo "  - ${DOCKERHUB_TAG}"
            echo "  - ${DOCKERHUB_LATEST}"
          fi
