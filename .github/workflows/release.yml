name: Release (build and push all CUDA variants)

# A new release tag (e.g. v1.6.3) triggers builds for ALL CUDA variants in
# parallel. Each variant gets its own fully-qualified tag (e.g.
# `v1.6.3-cuda13.0-pytorch2.12.0`). Only the default variant (cuda13.0 +
# pytorch2.12.0, the "newest" combo) is also tagged `:latest` and the bare
# version tag (e.g. `v1.6.3`) — the others stay as variant tags so
# :latest points to the recommended default.
#
# Why matrix: the comfyui-anime-bootstrap image has historically shipped
# with CUDA 13.0 + pytorch 2.12.0 (driver 580+). Older RunPod/Vast hosts
# (RTX 3080/3090, A4000, etc.) often ship driver 535/545/550 and can't
# load CUDA 13.0. Building all 4 variants on every release lets users
# pick the right tag for their host without us hand-rolling new image
# builds.
#
# To add a new variant: append a row to `CUDA_VARIANTS` below. The CI
# will pick it up automatically — no other change needed.

on:
  push:
    tags:
      - 'v*.*.*'

env:
  IMAGE_REPO: ${{ github.event.repository.name }}
  # Default / "latest" variant. Also the only one that gets the bare
  # `v<X>.<Y>.<Z>` tag and the `:latest` tag.
  DEFAULT_CUDA: '13.0'
  DEFAULT_PYTORCH: '2.12.0'
  DEFAULT_DRIVER_FLOOR: '12080'   # 580.x driver supports CUDA 13.0
  # Docker Hub is the sole registry. The username and project name are
  # overridable via secrets so the workflow isn't tied to one account.
  # Required secrets (set in repo Settings → Secrets):
  #   DOCKER_USERNAME          — Docker Hub account
  #   DOCKERHUB_TOKEN          — Docker Hub access token (Read/Write/Delete on the target repo)
  #   DOCKERHUB_PROJECT_NAME   — Docker Hub repo name (defaults to "${IMAGE_REPO}" if empty)
  DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
  DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
  DOCKERHUB_PROJECT_NAME: ${{ secrets.DOCKERHUB_PROJECT_NAME }}

defaults:
  run:
    shell: bash

jobs:
  build:
    name: build (${{ matrix.variant.label }})
    runs-on: ubuntu-latest
    strategy:
      # Don't cancel other variants if one fails — the user can still get
      # a working subset.
      fail-fast: false
      matrix:
        variant:
          # The default (recommended) variant. Also gets bare tag + :latest.
          - { cuda: '13.0', pytorch: '2.12.0', driver_floor: '12080', is_default: true  }
          # Fallback variants for hosts with older NVIDIA drivers.
          - { cuda: '12.8', pytorch: '2.9.1',  driver_floor: '570',  is_default: false }
          - { cuda: '12.4', pytorch: '2.6.0',  driver_floor: '550',  is_default: false }
          - { cuda: '12.1', pytorch: '2.5.1',  driver_floor: '535',  is_default: false }
    permissions:
      contents: read
      # `id-token: write` is required by docker/build-push-action@v7 to
      # auto-generate the Sigstore OCI provenance attestation alongside the
      # image. We rely on that built-in attestation (no explicit
      # actions/attest-build-provenance step) — having both caused the
      # second step to fail with "No credentials found for registry ***"
      # because build-push-action's post-step had already logged out of
      # Docker Hub by the time the explicit attest step ran.
      id-token: write
      # `attestations: write` is needed to publish the GitHub Artifact
      # Attestation (the slim SHA-pinned summary in the GH UI).
      attestations: write

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Read version + set per-variant tags
        id: cfg
        env:
          IN_CUDA: ${{ matrix.variant.cuda }}
          IN_PYTORCH: ${{ matrix.variant.pytorch }}
          IN_IS_DEFAULT: ${{ matrix.variant.is_default }}
          # Pass the git tag (e.g. v1.6.4) explicitly so we always use the
          # triggering tag as the image-tag namespace. Do NOT use
          # version.txt here — release-please bumps it just-in-time and a
          # race between file state and tag push could otherwise cause the
          # v<X>.<Y>.<Z> docker tag to lag behind (or lead) the git tag.
          IN_GIT_TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          # Strip the leading "v" from the git tag (e.g. "v1.6.4" → "1.6.4").
          VERSION="${IN_GIT_TAG#v}"
          CUDA="${IN_CUDA}"
          PYTORCH="${IN_PYTORCH}"
          PYTORCH_TAG="${PYTORCH}-cuda${CUDA}-cudnn9-runtime"
          VARIANT_TAG="cuda${CUDA}-pytorch${PYTORCH}"

          # GitHub UI copy-paste of secrets often introduces trailing
          # whitespace/newlines. Strip them or the image tag will be invalid
          # (`***/*** :v1.4.0` with a literal space, see run 27104690093).
          DOCKER_USERNAME="${DOCKER_USERNAME//[[:space:]]/}"
          DOCKERHUB_TOKEN="${DOCKERHUB_TOKEN//[[:space:]]/}"
          DOCKERHUB_PROJECT_NAME="${DOCKERHUB_PROJECT_NAME//[[:space:]]/}"
          if [ -z "${DOCKER_USERNAME}" ] || [ -z "${DOCKERHUB_TOKEN}" ]; then
            echo "::error::DOCKER_USERNAME and DOCKERHUB_TOKEN secrets must be set to publish a release."
            exit 1
          fi
          DOCKERHUB_REPO="${DOCKERHUB_PROJECT_NAME:-${IMAGE_REPO}}"
          IMAGE="${DOCKER_USERNAME}/${DOCKERHUB_REPO}"

          # Tag list for this variant:
          #   - Always:  ${variant}-tagged image (e.g. v1.6.3-cuda12.4-pytorch2.6.0)
          #   - Default variant only: ALSO tag with bare version (v1.6.3) and :latest
          TAGS="${IMAGE}:v${VERSION}-${VARIANT_TAG}"
          if [ "${IN_IS_DEFAULT}" = "true" ]; then
            TAGS="${TAGS},${IMAGE}:v${VERSION},${IMAGE}:latest"
          fi

          {
            printf 'version=%s\n'         "${VERSION}"
            printf 'cuda=%s\n'            "${CUDA}"
            printf 'pytorch=%s\n'         "${PYTORCH}"
            printf 'pytorch_tag=%s\n'     "${PYTORCH_TAG}"
            printf 'driver_floor=%s\n'    "${{ matrix.variant.driver_floor }}"
            printf 'variant_tag=%s\n'     "${VARIANT_TAG}"
            printf 'is_default=%s\n'      "${IN_IS_DEFAULT}"
            printf 'image=%s\n'           "${IMAGE}"
            printf 'tags=%s\n'            "${TAGS}"
          } >> "$GITHUB_OUTPUT"

          echo "--- variant config ---"
          echo "version:      v${VERSION}"
          echo "cuda:         ${CUDA}"
          echo "pytorch:      ${PYTORCH}"
          echo "pytorch_tag:  ${PYTORCH_TAG}"
          echo "driver_floor: ${{ matrix.variant.driver_floor }}"
          echo "is_default:   ${IN_IS_DEFAULT}"
          echo "image:        ${IMAGE}"
          echo "tags:         ${TAGS}"
          echo "------------------------"

      - name: Verify base image exists on Docker Hub
        run: |
          echo "Verifying docker.io/pytorch/pytorch:${{ steps.cfg.outputs.pytorch_tag }} exists..."
          http_code=$(curl -s -o /dev/null -w "%{http_code}" \
            "https://hub.docker.com/v2/repositories/pytorch/pytorch/tags/${{ steps.cfg.outputs.pytorch_tag }}/")
          if [ "$http_code" != "200" ]; then
            echo "::error::pytorch/pytorch:${{ steps.cfg.outputs.pytorch_tag }} not found on Docker Hub (HTTP $http_code)"
            echo "::error::Available tags: https://hub.docker.com/r/pytorch/pytorch/tags?name=cudnn9-runtime"
            exit 1
          fi
          echo "Base image exists on Docker Hub"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ env.DOCKER_USERNAME }}
          password: ${{ env.DOCKERHUB_TOKEN }}

      - name: Build and push to Docker Hub
        id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ steps.cfg.outputs.tags }}
          build-args: |
            CUDA_VERSION=${{ steps.cfg.outputs.cuda }}
            PYTORCH_VERSION=${{ steps.cfg.outputs.pytorch }}
            DRIVER_FLOOR=${{ steps.cfg.outputs.driver_floor }}
          platforms: linux/amd64
          cache-from: type=gha
          cache-to: type=gha,mode=max
          # Build the Sigstore OCI provenance in-line (no separate
          # `actions/attest-build-provenance` step needed). `provenance:
          # true` is the default but we set it explicitly so future
          # maintainers don't accidentally disable it.
          provenance: true
          sbom: false
