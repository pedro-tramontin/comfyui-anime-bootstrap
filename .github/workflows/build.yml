name: Build and Push

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      pytorch_tag:
        description: 'Full pytorch/pytorch tag (e.g. 2.12.0-cuda13.0-cudnn9-runtime)'
        required: false
        default: '2.12.0-cuda13.0-cudnn9-runtime'
        type: string
      cuda:
        description: 'CUDA major.minor (e.g. 13.0). Used for the image tag.'
        required: false
        default: '13.0'
        type: string
      pytorch:
        description: 'PyTorch version (e.g. 2.12.0). Used for the image tag.'
        required: false
        default: '2.12.0'
        type: string
      driver_floor:
        description: 'Minimum NVIDIA driver the host needs (e.g. 12080).'
        required: false
        default: '12080'
        type: string
      is_latest:
        description: 'Also publish this image as :latest'
        required: false
        type: boolean
        default: true

# Base-image build for one variant.
#
# The defaults below (and the workflow_dispatch input defaults above) define
# the "current" variant — what `latest` should point to on push/PR and what
# the manual trigger form is pre-filled with.
#
# Image tag scheme: cuda<MAJOR>.<MINOR>-pytorch<MAJOR>.<MINOR>.<PATCH>
# Example:         ghcr.io/pedro-tramontin/comfyui-anime-bootstrap:cuda13.0-pytorch2.12.0
#
# To publish a different variant:
#   - Trigger Actions -> Build and Push -> Run workflow, change the inputs.
#   - Or push a PR that updates the defaults in the `Set defaults` step.
#
# To add support for a new NVIDIA driver, update the defaults in BOTH the
# workflow_dispatch inputs (the form pre-fill) AND the `Set defaults` step
# (the actual values used on push/PR).

defaults:
  run:
    shell: bash

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}
  TEST_TAG: comfyui-anime-bootstrap:test

jobs:
  build:
    name: cuda${{ steps.cfg.outputs.cuda }}-pytorch${{ steps.cfg.outputs.pytorch }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      attestations: write
      id-token: write

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set defaults
        id: cfg
        env:
          in_pytorch_tag: ${{ inputs.pytorch_tag || '' }}
          in_cuda: ${{ inputs.cuda || '' }}
          in_pytorch: ${{ inputs.pytorch || '' }}
          in_driver_floor: ${{ inputs.driver_floor || '' }}
          in_is_latest: ${{ inputs.is_latest }}
        run: |
          set -euo pipefail
          # workflow_dispatch inputs override the YAML defaults; if the
          # input is blank (e.g. on push/PR), fall back to the defaults
          # baked into the workflow.
          PYTORCH_TAG="${in_pytorch_tag:-2.12.0-cuda13.0-cudnn9-runtime}"
          CUDA="${in_cuda:-13.0}"
          PYTORCH="${in_pytorch:-2.12.0}"
          DRIVER_FLOOR="${in_driver_floor:-12080}"
          IS_LATEST="${in_is_latest:-true}"

          # Compute the final image tag(s)
          VARIANT_TAG="cuda${CUDA}-pytorch${PYTORCH}"
          if [ "${IS_LATEST}" = "true" ]; then
            TAGS="${REGISTRY}/${IMAGE_NAME}:${VARIANT_TAG},${REGISTRY}/${IMAGE_NAME}:latest"
          else
            TAGS="${REGISTRY}/${IMAGE_NAME}:${VARIANT_TAG}"
          fi

          # Export for downstream steps
          cat >> "$GITHUB_OUTPUT" <<EOF
          pytorch_tag=${PYTORCH_TAG}
          cuda=${CUDA}
          pytorch=${PYTORCH}
          driver_floor=${DRIVER_FLOOR}
          is_latest=${IS_LATEST}
          variant_tag=${VARIANT_TAG}
          tags=${TAGS}
          EOF

          echo "--- build configuration ---"
          echo "pytorch_tag:  ${PYTORCH_TAG}"
          echo "cuda:         ${CUDA}"
          echo "pytorch:      ${PYTORCH}"
          echo "driver_floor: ${DRIVER_FLOOR}"
          echo "is_latest:    ${IS_LATEST}"
          echo "image tags:   ${TAGS}"
          echo "----------------------------"

      - name: Verify base image exists on Docker Hub
        # Fail fast if the pytorch/pytorch:<tag> we picked doesn't exist.
        # Without this, the build step fails 30s into layer pull instead of
        # at the top of the job where it's easy to fix.
        run: |
          echo "Verifying docker.io/pytorch/pytorch:${{ steps.cfg.outputs.pytorch_tag }} exists..."
          http_code=$(curl -s -o /dev/null -w "%{http_code}" \
            "https://hub.docker.com/v2/repositories/pytorch/pytorch/tags/${{ steps.cfg.outputs.pytorch_tag }}/")
          if [ "$http_code" != "200" ]; then
            echo "::error::pytorch/pytorch:${{ steps.cfg.outputs.pytorch_tag }} not found on Docker Hub (HTTP $http_code)"
            echo "::error::Available tags: https://hub.docker.com/r/pytorch/pytorch/tags?name=cudnn9-runtime"
            exit 1
          fi
          echo "✅ Tag exists on Docker Hub"

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.14'

      - name: Install test dependencies
        run: pip install -r tests/requirements.txt

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build test image (do not push yet)
        run: |
          docker build \
            --build-arg PYTORCH_TAG="${{ steps.cfg.outputs.pytorch_tag }}" \
            --build-arg CUDA_VERSION="${{ steps.cfg.outputs.cuda }}" \
            --build-arg PYTORCH_VERSION="${{ steps.cfg.outputs.pytorch }}" \
            --build-arg DRIVER_FLOOR="${{ steps.cfg.outputs.driver_floor }}" \
            -t "${TEST_TAG}" \
            .
          docker inspect "${TEST_TAG}" > /dev/null && echo "Image verified in local daemon"

      - name: Run integration tests
        run: pytest tests/integration_test.py -v --image-tag=${TEST_TAG}
        timeout-minutes: 10

      # Free disk space: drop the 6GB test image + prune buildx cache before
      # the push step builds the image again. GitHub runners have ~14GB
      # ephemeral; a PyTorch base + build layer + test image can blow past
      # that without explicit cleanup.
      - name: Free disk space before push
        if: github.event_name != 'pull_request'
        run: |
          docker rmi -f "${TEST_TAG}" 2>/dev/null || true
          docker builder prune -af --filter "until=1h" 2>/dev/null || true
          df -h /tmp /var/lib/docker 2>/dev/null | tail -5
          echo "Disk cleanup done"

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v4
        with:
          registry: ${REGISTRY}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push to GHCR
        if: github.event_name != 'pull_request'
        id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ steps.cfg.outputs.tags }}
          build-args: |
            PYTORCH_TAG=${{ steps.cfg.outputs.pytorch_tag }}
            CUDA_VERSION=${{ steps.cfg.outputs.cuda }}
            PYTORCH_VERSION=${{ steps.cfg.outputs.pytorch }}
            DRIVER_FLOOR=${{ steps.cfg.outputs.driver_floor }}
          platforms: linux/amd64
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Attest
        if: github.event_name != 'pull_request'
        uses: actions/attest-build-provenance@v4
        with:
          subject-name: ${REGISTRY}/${IMAGE_NAME}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true
