name: Build and Push (PR validation + manual)

on:
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      cuda:
        description: 'CUDA major.minor (e.g. 13.0). Used for the image tag and the pytorch/pytorch base.'
        required: false
        default: '13.0'
        type: string
      pytorch:
        description: 'PyTorch version (e.g. 2.12.0). Used for the image tag and the pytorch/pytorch base.'
        required: false
        default: '2.12.0'
        type: string
      driver_floor:
        description: 'Minimum NVIDIA driver the host needs (e.g. 12080). Baked into the image as an OCI label.'
        required: false
        default: '12080'
        type: string
      is_latest:
        description: 'If true, ALSO tag this image as :latest.'
        required: false
        type: boolean
        default: true
      tag_prefix:
        description: 'Optional prefix prepended to the variant tag (e.g. "v1.0.0-" produces "v1.0.0-cuda12.4-pytorch2.6.0"). Leave blank for the default "cuda<X>-pytorch<Y>" tag.'
        required: false
        type: string
        default: ''

defaults:
  run:
    shell: bash

env:
  IMAGE_REPO: ${{ github.event.repository.name }}
  # Docker Hub is the sole registry. The username and project name are
  # overridable via secrets so the workflow isn't tied to one account.
  # Required secrets (set in repo Settings → Secrets):
  #   DOCKER_USERNAME          — Docker Hub account
  #   DOCKERHUB_TOKEN          — Docker Hub access token (Read/Write/Delete on the target repo)
  #   DOCKERHUB_PROJECT_NAME   — Docker Hub repo name (defaults to "${IMAGE_REPO}" if empty)
  DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
  DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
  DOCKERHUB_PROJECT_NAME: ${{ secrets.DOCKERHUB_PROJECT_NAME }}

jobs:
  build:
    name: build-image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      attestations: write
      id-token: write

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set defaults
        id: cfg
        env:
          in_cuda: ${{ inputs.cuda }}
          in_pytorch: ${{ inputs.pytorch }}
          in_driver_floor: ${{ inputs.driver_floor }}
          in_is_latest: ${{ inputs.is_latest }}
          in_tag_prefix: ${{ inputs.tag_prefix }}
        run: |
          set -euo pipefail
          CUDA="${in_cuda:-13.0}"
          PYTORCH="${in_pytorch:-2.12.0}"
          DRIVER_FLOOR="${in_driver_floor:-12080}"
          IS_LATEST="${in_is_latest:-true}"
          TAG_PREFIX="${in_tag_prefix:-}"

          PYTORCH_TAG="${PYTORCH}-cuda${CUDA}-cudnn9-runtime"
          VARIANT_TAG="cuda${CUDA}-pytorch${PYTORCH}"

          # GitHub UI copy-paste of secrets often introduces trailing
          # whitespace/newlines. Strip them or the image tag will be invalid
          # (`***/*** :v1.4.0` with a literal space, see run 27104690093).
          DOCKER_USERNAME="${DOCKER_USERNAME//[[:space:]]/}"
          DOCKERHUB_TOKEN="${DOCKERHUB_TOKEN//[[:space:]]/}"
          DOCKERHUB_PROJECT_NAME="${DOCKERHUB_PROJECT_NAME//[[:space:]]/}"

          # DOCKER_USERNAME and DOCKERHUB_PROJECT_NAME are required for the
          # build to be pushed. Fail fast with a clear error if either is
          # missing (the PR-validation runner might not have them set).
          if [ -z "${DOCKER_USERNAME}" ] || [ -z "${DOCKERHUB_TOKEN}" ]; then
            echo "::error::DOCKER_USERNAME and DOCKERHUB_TOKEN secrets must be set to build this image."
            exit 1
          fi
          DOCKERHUB_REPO="${DOCKERHUB_PROJECT_NAME:-${IMAGE_REPO}}"
          IMAGE="${DOCKER_USERNAME}/${DOCKERHUB_REPO}"

          TAGS="${IMAGE}:${TAG_PREFIX}${VARIANT_TAG}"
          if [ "${IS_LATEST}" = "true" ]; then
            TAGS="${TAGS},${IMAGE}:latest"
          fi

          {
            printf 'pytorch_tag=%s\n'  "${PYTORCH_TAG}"
            printf 'cuda=%s\n'         "${CUDA}"
            printf 'pytorch=%s\n'      "${PYTORCH}"
            printf 'driver_floor=%s\n' "${DRIVER_FLOOR}"
            printf 'is_latest=%s\n'    "${IS_LATEST}"
            printf 'tag_prefix=%s\n'   "${TAG_PREFIX}"
            printf 'variant_tag=%s\n'  "${VARIANT_TAG}"
            printf 'image=%s\n'        "${IMAGE}"
            printf 'tags=%s\n'         "${TAGS}"
          } >> "$GITHUB_OUTPUT"

          echo "--- build configuration ---"
          echo "pytorch_tag:  ${PYTORCH_TAG}"
          echo "cuda:         ${CUDA}"
          echo "pytorch:      ${PYTORCH}"
          echo "driver_floor: ${DRIVER_FLOOR}"
          echo "is_latest:    ${IS_LATEST}"
          echo "tag_prefix:   ${TAG_PREFIX}"
          echo "image:        ${IMAGE}"
          echo "image tags:   ${TAGS}"
          echo "----------------------------"

      - name: Verify base image exists on Docker Hub
        run: |
          echo "Verifying docker.io/pytorch/pytorch:${{ steps.cfg.outputs.pytorch_tag }} exists..."
          http_code=$(curl -s -o /dev/null -w "%{http_code}" \
            "https://hub.docker.com/v2/repositories/pytorch/pytorch/tags/${{ steps.cfg.outputs.pytorch_tag }}/")
          if [ "$http_code" != "200" ]; then
            echo "::error::pytorch/pytorch:${{ steps.cfg.outputs.pytorch_tag }} not found on Docker Hub (HTTP $http_code)"
            echo "::error::Available tags: https://hub.docker.com/r/pytorch/pytorch/tags?name=cudnn9-runtime"
            exit 1
          fi
          echo "Tag exists on Docker Hub"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to Docker Hub
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v4
        with:
          username: ${{ env.DOCKER_USERNAME }}
          password: ${{ env.DOCKERHUB_TOKEN }}

      - name: Build and push to Docker Hub
        if: github.event_name != 'pull_request'
        id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ steps.cfg.outputs.tags }}
          build-args: |
            CUDA_VERSION=${{ steps.cfg.outputs.cuda }}
            PYTORCH_VERSION=${{ steps.cfg.outputs.pytorch }}
            DRIVER_FLOOR=${{ steps.cfg.outputs.driver_floor }}
          platforms: linux/amd64
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Attest build provenance
        if: github.event_name != 'pull_request'
        uses: actions/attest-build-provenance@v4
        with:
          subject-name: ${{ steps.cfg.outputs.image }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true
