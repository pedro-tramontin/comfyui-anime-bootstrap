name: Build and Push (PR validation + manual)

on:
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      cuda:
        description: 'CUDA major.minor (e.g. 13.0). Used for the image tag and the pytorch/pytorch base.'
        required: false
        default: '13.0'
        type: string
      pytorch:
        description: 'PyTorch version (e.g. 2.12.0). Used for the image tag and the pytorch/pytorch base.'
        required: false
        default: '2.12.0'
        type: string
      driver_floor:
        description: 'Minimum NVIDIA driver the host needs (e.g. 12080). Baked into the image as an OCI label.'
        required: false
        default: '12080'
        type: string
      is_latest:
        description: 'If true, ALSO tag this image as :latest.'
        required: false
        type: boolean
        default: true
      tag_prefix:
        description: 'Optional prefix prepended to the variant tag (e.g. "v1.0.0-" produces "v1.0.0-cuda12.4-pytorch2.6.0"). Leave blank for the default "cuda<X>-pytorch<Y>" tag.'
        required: false
        type: string
        default: ''

defaults:
  run:
    shell: bash

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}
  # Docker Hub mirror — read from secret so the username isn't hardcoded.
  # Required secrets (set in repo Settings → Secrets):
  #   DOCKER_USERNAME          — Docker Hub account
  #   DOCKERHUB_TOKEN          — Docker Hub access token (Read/Write/Delete on the target repo)
  #   DOCKERHUB_PROJECT_NAME   — Docker Hub repo name (defaults to "${IMAGE_NAME##*/}" if empty)
  DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
  DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
  DOCKERHUB_PROJECT_NAME: ${{ secrets.DOCKERHUB_PROJECT_NAME }}
  # Skip Docker Hub mirror entirely if DOCKER_USERNAME or DOCKERHUB_TOKEN is missing.
  PUSH_TO_DOCKERHUB: ${{ secrets.DOCKER_USERNAME != '' && secrets.DOCKERHUB_TOKEN != '' }}

jobs:
  build:
    name: build-image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      attestations: write
      id-token: write

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set defaults
        id: cfg
        env:
          in_cuda: ${{ inputs.cuda }}
          in_pytorch: ${{ inputs.pytorch }}
          in_driver_floor: ${{ inputs.driver_floor }}
          in_is_latest: ${{ inputs.is_latest }}
          in_tag_prefix: ${{ inputs.tag_prefix }}
        run: |
          set -euo pipefail
          CUDA="${in_cuda:-13.0}"
          PYTORCH="${in_pytorch:-2.12.0}"
          DRIVER_FLOOR="${in_driver_floor:-12080}"
          IS_LATEST="${in_is_latest:-true}"
          TAG_PREFIX="${in_tag_prefix:-}"

          PYTORCH_TAG="${PYTORCH}-cuda${CUDA}-cudnn9-runtime"
          VARIANT_TAG="cuda${CUDA}-pytorch${PYTORCH}"

          # IMAGE_NAME on GHCR is "<owner>/<repo>"; Docker Hub uses
          # DOCKERHUB_PROJECT_NAME (overridable) or the bare repo name under
          # DOCKER_USERNAME (e.g. docker.io/<user>/<repo>).
          REPO="${IMAGE_NAME##*/}"
          GHCR_BASE="${REGISTRY}/${IMAGE_NAME}"
          DOCKERHUB_REPO="${DOCKERHUB_PROJECT_NAME:-${REPO}}"
          DOCKERHUB_BASE="docker.io/${DOCKER_USERNAME}/${DOCKERHUB_REPO}"

          TAGS="${GHCR_BASE}:${TAG_PREFIX}${VARIANT_TAG}"
          if [ "${IS_LATEST}" = "true" ]; then
            TAGS="${TAGS},${GHCR_BASE}:latest"
          fi

          # Mirror to Docker Hub when both required secrets are set. Public
          # images on Docker Hub are free to push (Docker Pro not required
          # for public repos).
          if [ "${PUSH_TO_DOCKERHUB}" = "true" ]; then
            TAGS="${TAGS},${DOCKERHUB_BASE}:${TAG_PREFIX}${VARIANT_TAG}"
            if [ "${IS_LATEST}" = "true" ]; then
              TAGS="${TAGS},${DOCKERHUB_BASE}:latest"
            fi
          else
            echo "::notice::DOCKER_USERNAME and/or DOCKERHUB_TOKEN secrets are missing; skipping Docker Hub mirror."
          fi

          {
            printf 'pytorch_tag=%s\n'  "${PYTORCH_TAG}"
            printf 'cuda=%s\n'         "${CUDA}"
            printf 'pytorch=%s\n'      "${PYTORCH}"
            printf 'driver_floor=%s\n' "${DRIVER_FLOOR}"
            printf 'is_latest=%s\n'    "${IS_LATEST}"
            printf 'tag_prefix=%s\n'   "${TAG_PREFIX}"
            printf 'variant_tag=%s\n'  "${VARIANT_TAG}"
            printf 'tags=%s\n'         "${TAGS}"
            printf 'push_to_dockerhub=%s\n' "${PUSH_TO_DOCKERHUB}"
            printf 'dockerhub_base=%s\n' "${DOCKERHUB_BASE:-}"
          } >> "$GITHUB_OUTPUT"

          echo "--- build configuration ---"
          echo "pytorch_tag:      ${PYTORCH_TAG}"
          echo "cuda:             ${CUDA}"
          echo "pytorch:          ${PYTORCH}"
          echo "driver_floor:     ${DRIVER_FLOOR}"
          echo "is_latest:        ${IS_LATEST}"
          echo "tag_prefix:       ${TAG_PREFIX}"
          echo "image tags:       ${TAGS}"
          echo "push_to_dockerhub: ${PUSH_TO_DOCKERHUB}"
          if [ "${PUSH_TO_DOCKERHUB}" = "true" ]; then
            echo "dockerhub_base:   ${DOCKERHUB_BASE}"
          fi
          echo "----------------------------"

      - name: Verify base image exists on Docker Hub
        run: |
          echo "Verifying docker.io/pytorch/pytorch:${{ steps.cfg.outputs.pytorch_tag }} exists..."
          http_code=$(curl -s -o /dev/null -w "%{http_code}" \
            "https://hub.docker.com/v2/repositories/pytorch/pytorch/tags/${{ steps.cfg.outputs.pytorch_tag }}/")
          if [ "$http_code" != "200" ]; then
            echo "::error::pytorch/pytorch:${{ steps.cfg.outputs.pytorch_tag }} not found on Docker Hub (HTTP $http_code)"
            echo "::error::Available tags: https://hub.docker.com/r/pytorch/pytorch/tags?name=cudnn9-runtime"
            exit 1
          fi
          echo "Tag exists on Docker Hub"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Log in to Docker Hub
        if: github.event_name != 'pull_request' && env.PUSH_TO_DOCKERHUB == 'true'
        uses: docker/login-action@v4
        with:
          registry: docker.io
          username: ${{ env.DOCKER_USERNAME }}
          password: ${{ env.DOCKERHUB_TOKEN }}

      - name: Build and push to GHCR (and Docker Hub if secrets set)
        if: github.event_name != 'pull_request'
        id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ steps.cfg.outputs.tags }}
          build-args: |
            CUDA_VERSION=${{ steps.cfg.outputs.cuda }}
            PYTORCH_VERSION=${{ steps.cfg.outputs.pytorch }}
            DRIVER_FLOOR=${{ steps.cfg.outputs.driver_floor }}
          platforms: linux/amd64
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Attest
        if: github.event_name != 'pull_request'
        uses: actions/attest-build-provenance@v4
        with:
          subject-name: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true
