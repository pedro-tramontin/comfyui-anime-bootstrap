name: Release Please

on:
  push:
    branches:
      - main

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    steps:
      # Diagnostic: confirm the secret contains the new PAT (not a stale value).
      # Prints only the first 4 chars ("github_pat_11A..." prefix); the rest
      # is masked by GitHub's log scrubber. Remove this step once PAT issue is
      # resolved.
      - name: Debug secret prefix
        env:
          FULL_TOKEN: ${{ secrets.RELEASE_PLEASE_TOKEN }}
        run: |
          echo "Token starts with: ${FULL_TOKEN:0:20}..."
          echo "Token length: ${#FULL_TOKEN}"
      - uses: googleapis/release-please-action@v5
        with:
          token: ${{ secrets.RELEASE_PLEASE_TOKEN }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
